<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Active Layer Stroke Test</title><style>html, body, #app { margin:0; width:100%; height:100%; overflow:hidden; background:#f3f2ef; }
    body { font:13px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color:#f2eee6; }
    #app { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 12px; background:#2c302b; border-bottom:1px solid rgba(255,255,255,.1); }
    label { display:flex; align-items:center; gap:6px; color:#d8d1c7; font-size:12px; }
    select, button, input[type="color"] { height:32px; border:1px solid rgba(255,255,255,.18); background:#383d36; color:#f2eee6; border-radius:6px; box-sizing:border-box; }
    select { padding:0 8px; min-width:150px; }
    input[type="color"] { width:44px; padding:3px; }
    input[type="checkbox"] { width:16px; height:16px; accent-color:#74d1ff; }
    button { padding:0 11px; font-weight:700; }
    .summary { color:#d8d1c7; font:600 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .stage { position:relative; min-height:0; }
    canvas { position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:none; }
    #gl { cursor:crosshair; }
    #grid { pointer-events:none; }</style><script defer="defer" src="tiledStrokeTest.bundle.js"></script></head><body><div id="app"><div class="toolbar"><label>tool <select id="tool"><option value="brush">브러시</option><option value="flood">FLOOD FILL</option></select></label> <label>brush <select id="brush"><option value="basic">기본</option><option value="smudge">스머징</option><option value="watercolor">수채화효과</option></select></label> <label>color <input id="color" type="color" value="#1f1f1f"></label> <label><input id="tile-engine" type="checkbox" checked="checked">tile engine</label> <label><input id="tile-indicator" type="checkbox">tile indicator</label> <label><input id="hold-correct" type="checkbox">hold 선보정</label> <label><input id="alpha-lock" type="checkbox">alpha lock</label> <button id="clear">clear</button> <span id="summary" class="summary">loading active layer...</span></div><div class="stage"><canvas id="gl"></canvas><canvas id="grid"></canvas></div></div></body></html>
