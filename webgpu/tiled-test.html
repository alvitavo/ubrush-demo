<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tiled Canvas Test</title><style>html, body, #app { margin:0; width:100%; height:100%; overflow:hidden; background:#1f211f; }
    body { font:13px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color:#f4f0e8; }
    #app { display:grid; grid-template-rows:auto 1fr; }
    .bar { display:flex; gap:10px; align-items:center; padding:10px 12px; background:#2b2d2a; border-bottom:1px solid rgba(255,255,255,.1); }
    button { border:1px solid rgba(255,255,255,.18); background:#3a3d38; color:#f4f0e8; border-radius:6px; padding:7px 10px; font-weight:700; }
    pre { margin:0; white-space:pre-wrap; color:#cfc5b5; }
    .stage { position:relative; min-height:0; }
    canvas { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }
    .panel { position:absolute; left:12px; bottom:12px; max-width:min(520px, calc(100% - 24px)); padding:10px 12px; background:rgba(0,0,0,.62); border:1px solid rgba(255,255,255,.12); border-radius:8px; }</style><script defer="defer" src="tiledTest.bundle.js"></script></head><body><div id="app"><div class="bar"><button id="sparse">sparse</button> <button id="overlap">300 overlap</button> <button id="evict">evict GPU to 16</button> <button id="compress">compress CPU</button> <button id="evict-cache">evict cache to 8</button> <button id="recomposite">recomposite all</button> <button id="verify">verify</button> <button id="rerun">rerun</button><pre id="summary">initializing...</pre></div><div class="stage"><canvas id="gl"></canvas><div class="panel"><pre id="details"></pre></div></div></div></body></html>
