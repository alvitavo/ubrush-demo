<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tiled Stroke Test 2</title><style>html, body, #app { margin:0; width:100%; height:100%; overflow:hidden; background:#f3f2ef; }
    body { font:13px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color:#f2eee6; }
    #app { display:grid; grid-template-rows:auto 1fr; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 12px; background:#252923; border-bottom:1px solid rgba(255,255,255,.1); }
    label { display:flex; align-items:center; gap:6px; color:#d8d1c7; font-size:12px; }
    select, button, input[type="color"] { height:32px; border:1px solid rgba(255,255,255,.18); background:#383d36; color:#f2eee6; border-radius:6px; box-sizing:border-box; }
    select { padding:0 8px; min-width:150px; }
    #brush { min-width:min(520px, 52vw); }
    input[type="color"] { width:44px; padding:3px; }
    button { padding:0 11px; font-weight:700; }
    .summary { color:#d8d1c7; font:600 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .stage { position:relative; min-height:0; }
    canvas { position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:none; }
    #gl { cursor:crosshair; }
    #grid { pointer-events:none; }
    .brush-editor {
      position:absolute; top:12px; right:12px; bottom:12px; width:min(430px, calc(100vw - 24px));
      display:none; grid-template-rows:auto 1fr; background:#1f211e; border:1px solid rgba(255,255,255,.16);
      box-shadow:0 18px 50px rgba(0,0,0,.34); z-index:3; overflow:hidden;
    }
    .brush-editor.open { display:grid; }
    .editor-head { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.12); }
    .editor-title { font-weight:800; color:#f2eee6; flex:1; }
    .editor-status { color:#9dbbda; font:600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .editor-body { display:grid; grid-template-columns:122px 1fr; min-height:0; }
    .editor-tabs { overflow:auto; border-right:1px solid rgba(255,255,255,.1); background:#282c26; padding:6px 0; }
    .editor-tabs button { width:100%; height:auto; min-height:34px; border:0; border-left:3px solid transparent; border-radius:0; background:transparent; color:#aaa; text-align:left; padding:8px 10px; font-size:12px; }
    .editor-tabs button.active { color:#fff; background:#333832; border-left-color:#7aa6d9; }
    .editor-content { overflow:auto; padding:10px 14px 18px; }</style><script defer="defer" src="tiledStrokeTest2.bundle.js"></script></head><body><div id="app"><div class="toolbar"><label>brush <select id="brush"></select></label> <label>tiles <select id="tile-count"><option value="1">1</option><option value="4">4</option><option value="9">9</option><option value="16" selected="selected">16</option><option value="64">64</option><option value="256">256</option></select></label> <label>color <input id="color" type="color" value="#1f1f1f"></label> <button id="dry">dry</button> <button id="debug-tile">debug off</button> <button id="brush-editor-toggle">brush edit</button> <button id="clear">clear</button> <span id="summary" class="summary">loading tiled engine...</span></div><div class="stage"><canvas id="gl"></canvas><canvas id="grid"></canvas><section id="brush-editor-panel" class="brush-editor"><div class="editor-head"><span class="editor-title">Brush Editor</span> <span id="brush-editor-status" class="editor-status"></span> <button id="brush-editor-close">close</button></div><div class="editor-body"><div id="brush-editor-tabs" class="editor-tabs"></div><div id="brush-editor-content" class="editor-content"></div></div></section></div></div></body></html>
